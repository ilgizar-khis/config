# font
font_family FiraCode Nerd Font Mono
# force_ltr no
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12
disable_ligatures always

# cursor
cursor #ffffff
cursor_text_color #232323
cursor_shape block

# scrollbar
scrollbar never

# colorscheme
background_opacity 0.8
background #000000
background_image none

color252 #343434
color254 #ababab
color253 #555555
color255 #ffffff
color0 #000000

# window
window_padding_width 0
# window_margin_width 0
