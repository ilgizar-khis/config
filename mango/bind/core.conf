# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

keymode=default
# reload config
bind=Super+Shift,r,reload_config

# exit
bind=Super+Shift,m,quit
bind=Super+Shift,q,killclient,

bind=Super,0,setkeymode,resize
keymode=resize
bind=None,Escape,setkeymode,default
bind=Super,0,setkeymode,default
# resizewin
bind=Super,k,resizewin,+0,-50
bind=Super,j,resizewin,+0,+50
bind=Super,h,resizewin,-50,+0
bind=Super,l,resizewin,+50,+0
# movewin
bind=Super+Shift,k,movewin,+0,-50
bind=Super+Shift,j,movewin,+0,+50
bind=Super+Shift,h,movewin,-50,+0
bind=Super+Shift,l,movewin,+50,+0

# switch layout
# bind=Super,n,switch_layout

